name: wynnsea-api

services:
  # Laravel (php-fpm). Runs migrations + seeders on start.
  app:
    build:
      context: .
      target: app
    image: wynnsea-api:latest
    restart: unless-stopped
    env_file: .env.docker
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  # Queue worker (email notification for new contact messages).
  queue:
    image: wynnsea-api:latest
    restart: unless-stopped
    env_file: .env.docker
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_started

  # nginx: public entry point at http://localhost:8000
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - uploads:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Test suite: docker compose --profile test run --rm --build test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test

volumes:
  uploads:
  mysql-data:
