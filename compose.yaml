name: wynnsea-api

services:
  # Laravel (php-fpm). Runs migrations + seeders on start.
  app:
    build:
      context: .
      target: app
    image: wynnsea-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  # Queue worker (email notification for new contact messages).
  queue:
    image: wynnsea-api:latest
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_started

  # nginx: public entry point at http://localhost:8000
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - uploads:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # phpMyAdmin browser UI for the local MySQL database.
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${DB_PHPMYADMIN_HOST:-127.0.0.1}:${DB_PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy

  # Test suite: docker compose --profile test run --rm --build test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test

volumes:
  uploads:
  mysql-data:
